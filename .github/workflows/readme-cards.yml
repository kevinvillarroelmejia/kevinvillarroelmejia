name: Render README cards

on:
  schedule:
    - cron: "30 4 * * *"   # cada día
  workflow_dispatch:       # para lanzarlo a mano
  push:
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contributions and repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, htop, keys)
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Redibuja las tarjetas del README"
            git push
          fi
